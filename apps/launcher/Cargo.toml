[package]
name = "plc-lab-launcher"
description = "Root launchers: Launcher.exe (status, projects, diagnostics) and the PLC Lab.exe alias."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "plc_lab_launcher"
path = "src/lib.rs"

# Compatibility alias, staged as `PLC Lab.exe`: starts the application directly.
[[bin]]
name = "plc-lab-launcher"
path = "src/main.rs"

# The primary entry point, staged as `Launcher.exe`.
[[bin]]
name = "Launcher"
path = "src/bin/launcher.rs"

[dependencies]
knowledge-core.workspace = true
lab-model.workspace = true
project-model.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
winsafe = { version = "0.0.29", features = ["gui", "shell", "advapi", "dwm"] }

[target.'cfg(windows)'.build-dependencies]
tauri-winres = "0.3"

[lints]
workspace = true
