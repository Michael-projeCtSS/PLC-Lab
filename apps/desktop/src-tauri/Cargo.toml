[package]
name = "plc-lab-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "plc_lab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "plc-lab-desktop"
path = "src/main.rs"
test = false
bench = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
app-contract.workspace = true
desktop-session.workspace = true
tokio = { version = "1", features = ["time"] }

# Native message boxes for startup problems and the WebView2 runtime check (safe Win32).
[target.'cfg(windows)'.dependencies]
winsafe = { version = "0.0.29", features = ["advapi", "user"] }

[lints]
workspace = true
