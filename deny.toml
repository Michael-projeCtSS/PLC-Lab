# cargo-deny policy (checked in the Linux CI lane): advisories, licenses, bans, sources.
[graph]
all-features = false

[advisories]
# Unmaintained crates deep in the Tauri/WebView stack are reported, not fatal;
# vulnerabilities always fail.
unmaintained = "workspace"
yanked = "deny"
ignore = [
  # glib 0.18 is pulled in only by Tauri 2's Linux GTK/WebKitGTK stack (gtk-rs 0.18);
  # the fix requires glib >= 0.20, which Tauri 2 does not support. PLC Lab never calls
  # glib::VariantStrIter, and the Windows product does not compile glib at all.
  # Re-evaluate when Tauri moves to gtk-rs >= 0.20.
  { id = "RUSTSEC-2024-0429", reason = "transitive Linux-only Tauri dependency; affected API unused; no compatible fix" },
]

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "0BSD",
  "Unlicense",
  "CDLA-Permissive-2.0",
]

[licenses.private]
# Workspace crates are not published.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
