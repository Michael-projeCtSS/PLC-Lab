[workspace]
resolver = "3"
members = [
  "apps/desktop/src-tauri",
  "crates/*",
  "languages/st",
  "tests/conformance",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
plc-types = { path = "crates/plc-types" }
plc-ir = { path = "crates/plc-ir" }
plc-runtime = { path = "crates/plc-runtime" }
simulation-core = { path = "crates/simulation-core" }
trace-core = { path = "crates/trace-core" }
network-core = { path = "crates/network-core" }
grading-core = { path = "crates/grading-core" }
app-contract = { path = "crates/app-contract" }
desktop-session = { path = "crates/desktop-session" }
process-simulation = { path = "crates/process-simulation" }
st-frontend = { path = "languages/st" }
lab-model = { path = "crates/lab-model" }
hardware-model = { path = "crates/hardware-model" }
lab-engine = { path = "crates/lab-engine" }
knowledge-core = { path = "crates/knowledge-core" }
project-model = { path = "crates/project-model" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
