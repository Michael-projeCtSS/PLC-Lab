name: Canonical validation

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      windows-artifact-id:
        description: Immutable unsigned Windows development artifact ID from this validated commit
        value: ${{ jobs.windows-validation.outputs.artifact-id }}
      windows-artifact-digest:
        description: SHA-256 of the unsigned Windows development artifact archive
        value: ${{ jobs.windows-validation.outputs.artifact-digest }}

permissions:
  contents: read

jobs:
  windows-validation:
    name: Windows checks, native smoke and release
    runs-on: windows-2022
    timeout-minutes: 75
    outputs:
      artifact-id: ${{ steps.unsigned-windows.outputs.artifact-id }}
      artifact-digest: ${{ steps.unsigned-windows.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Install locked Node dependencies
        run: node scripts/ci.mjs dependencies
      - name: Install repository-pinned Rust and quality components
        run: node scripts/ci.mjs setup-rust
      - name: Verify Windows build tools and provide WebView2 if needed
        run: node scripts/ci.mjs windows-prerequisites
      - name: Install the pinned signing client and exercise its real CLI without credentials
        shell: pwsh
        run: |
          node scripts/esigner.mjs install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/esigner.mjs doctor
      - name: Checks, release tests, knowledge pack, native smoke, release build and root PLC Lab.exe smoke
        run: npm run ci:windows
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-validation-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/ci/**/*.log
            artifacts/ci/**/result.json
            artifacts/desktop-smoke/native.log
            artifacts/desktop-smoke/result.json
            artifacts/desktop-smoke/*.png
            artifacts/editor-keyboard/*.png
            artifacts/editor-keyboard/failure.json
            artifacts/sequence-session/*.png
            artifacts/pou-session/*.png
            artifacts/pid-session/*.png
            artifacts/lad-session/*.png
            artifacts/release-smoke/native.log
            artifacts/release-smoke/result.json
            artifacts/release-smoke/*.png
            artifacts/release-relocated-smoke/native.log
            artifacts/release-relocated-smoke/result.json
            artifacts/release-relocated-smoke/*.png
            artifacts/release-bat-smoke/native.log
            artifacts/release-bat-smoke/result.json
      - name: Publish the validated UNSIGNED Windows development build
        id: unsigned-windows
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: plc-lab-windows-UNSIGNED-development-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            PLC Lab.exe
            RUN_PLC_LAB.bat
            resources/**
            releases/knowledge/**

  linux-core:
    name: Linux core, frontend, knowledge and supply-chain checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Install locked Node dependencies
        run: node scripts/ci.mjs dependencies
      - name: Install repository-pinned Rust and quality components
        run: node scripts/ci.mjs setup-rust
      - name: Install cargo-deny
        run: node scripts/ci.mjs install-deny
      - name: Rust quality and tests, frontend, architecture, knowledge pack, audits
        run: npm run ci:core
      - name: Preserve core evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-core-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/ci/**/*.log
            artifacts/ci/**/result.json
